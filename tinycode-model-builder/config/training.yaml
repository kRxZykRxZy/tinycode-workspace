# Training configuration.
#
# target_tokens is the number of *committed training tokens*.  Validation
# tokens are tracked separately and never count towards this target.

training:
  target_tokens: 200000000
  batch_size: 8
  micro_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  warmup_steps: 500
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  optimizer: adamw
  precision: auto
  seed: 1337
  log_every: 20
  eval_every: 500
  checkpoint_every: 1000
  max_hours: 0.0
  val_split: 0.005
