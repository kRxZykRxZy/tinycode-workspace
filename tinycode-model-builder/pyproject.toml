[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinycode-model-builder"
version = "0.1.0"
description = "Model builder for the TinyCode compact coding-model platform: configuration, training, evaluation and artifact export."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TinyCode" }]
keywords = ["tinycode", "coding-model", "transformer", "training", "pytorch"]

dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "tokenizers>=0.15",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "tqdm>=4.66",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "safetensors>=0.4",
    "huggingface-hub>=0.23",
]

[project.optional-dependencies]
datasets = ["datasets>=2.18", "pyarrow>=15.0"]
openvino = ["onnx>=1.16", "openvino>=2024.0"]
dev = ["pytest>=8.0", "pytest-timeout>=2.2", "ruff>=0.4"]
gguf = ["gguf>=0.10"]

[project.scripts]
tinycode-builder = "tinycode_builder.application.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tinycode_builder = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
